services:
  db:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.track_planning=on
      - -c
      - pg_stat_statements.track_utility=on
      - -c
      - track_wal_io_timing=on
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
    volumes:
      - postgres_data:/var/lib/postgresql:rw
    networks:
      - root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  runner:
    build:
      context: .
      dockerfile: ${RUNNER_DOCKERFILE:-benchmarks/sqlalchemy_bench/Dockerfile}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      OFFSET: ${OFFSET}
      ITERATIONS: ${ITERATIONS}
      LIMIT: ${LIMIT}
      LARGE_LIMIT: ${LARGE_LIMIT}
      WARMUP_ITERATIONS: ${WARMUP_ITERATIONS}
      SELECT_REPEATS: ${SELECT_REPEATS}
    networks:
      - root

volumes:
  postgres_data:
    name: ${POSTGRES_RUN_VOLUME}
  postgres_golden:
    name: ${POSTGRES_GOLDEN_VOLUME}
    external: true

networks:
  root:
    driver: bridge